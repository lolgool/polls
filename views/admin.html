<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.0.0"></script>
    
    <script src="/socket.io/socket.io.js"></script>
    <style>
        body { font-family: sans-serif; padding: 20px; max-width: 800px; margin: 0 auto; }
        .top-bar { display: flex; justify-content: space-between; align-items: center; }
        .controls { background: #eee; padding: 20px; border-radius: 8px; margin-top: 20px; }
        input { padding: 10px; margin: 5px 0; width: 100%; box-sizing: border-box; }
        button { padding: 10px 20px; background: #333; color: white; border: none; cursor: pointer; }
        a { color: red; text-decoration: none; font-weight: bold; }
    </style>
</head>
<body>
    <div class="top-bar">
        <h1>👮 Panel de Control</h1>
        <a href="/logout">Cerrar Sesión</a>
    </div>

    <div class="controls">
        <h3>Lanzar Nueva Encuesta</h3>
        <input type="text" id="pregunta" placeholder="Pregunta (Ej: ¿Mejor fruta?)">
        <input type="text" id="opciones" placeholder="Opciones separadas por coma (Ej: Pera, Manzana, Uva)">
        <button onclick="lanzar()">Publicar Encuesta</button>
    </div>

    <canvas id="miGrafica" style="margin-top: 30px;"></canvas>

    <script>
        // Registramos el plugin para poder usarlo
        Chart.register(ChartDataLabels);

        const socket = io();
        let chart;

        function lanzar() {
            const pregunta = document.getElementById('pregunta').value;
            const opRaw = document.getElementById('opciones').value.split(',');
            if(!pregunta || opRaw.length < 2) return alert("Llena los datos bien");

            const opciones = opRaw.map((txt, i) => ({ id: 'opt'+i, texto: txt.trim(), votos: 0 }));
            socket.emit('crearEncuesta', { pregunta, opciones });
        }

        socket.on('actualizarDatos', (data) => {
            const ctx = document.getElementById('miGrafica').getContext('2d');
            const labels = data.opciones.map(o => o.texto);
            const values = data.opciones.map(o => o.votos);

            if (chart) {
                chart.data.labels = labels;
                chart.data.datasets[0].data = values;
                chart.data.datasets[0].label = data.pregunta;
                chart.update();
            } else {
                chart = new Chart(ctx, {
                    type: 'bar',
                    data: {
                        labels: labels,
                        datasets: [{ 
                            label: data.pregunta, 
                            data: values, 
                            backgroundColor: '#36A2EB' 
                        }]
                    },
                    options: {
                        scales: { y: { beginAtZero: true, ticks: { stepSize: 1 } } },
                        plugins: {
                            // CONFIGURACIÓN DE LOS NÚMEROS EN BARRAS
                            datalabels: {
                                color: 'white', // Color del número
                                anchor: 'center', // Posición (end, center, start)
                                align: 'center',
                                font: {
                                    weight: 'bold',
                                    size: 20
                                }
                            }
                        }
                    }
                });
            }
        });
    </script>
</body>
</html>
